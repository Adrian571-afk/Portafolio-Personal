    <section id="contacto" class="container contenedor mt-5 pb-5">
        <h1 class="display-4 fw-bold text-center text-danger mb-5">Contáctame</h1>
        
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                
                <form action="https://formspree.io/f/xqppzlge" method="POST">
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="nombre" class="form-label text-light">Nombre</label>
                            <input type="text" class="form-control bg-dark text-light border-secondary" id="nombre" name="nombre" required>
                        </div>
                        <div class="col-md-6 mt-3 mt-md-0">
                            <label for="email" class="form-label text-light">Correo Electrónico</label>
                            <input type="email" class="form-control bg-dark text-light border-secondary" id="email" name="email" required>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="asunto" class="form-label text-light">Asunto</label>
                        <input type="text" class="form-control bg-dark text-light border-secondary" id="asunto" name="asunto" required>
                    </div>
                    
                    <div class="mb-4">
                        <label for="mensaje" class="form-label text-light">Mensaje</label>
                        <textarea class="form-control bg-dark text-light border-secondary" id="mensaje" name="mensaje" rows="4" required></textarea>
                    </div>
                    
                    <div class="d-grid gap-2 col-md-6 mx-auto">
                        <button type="submit" class="btn btn-outline-danger btn-lg fw-bold">Enviar Mensaje</button>
                    </div>

                </form>
            </div>
        </div>
    </section>

    <section id="ubicación" class="container bg-danger p-0 pt-2 pb-3 pt-lg-5">
        <h1 class="display-4 fw-bold text-center text-light pb-3 d-none d-lg-block">Ubicación</h1>

            </div>
        </div>
